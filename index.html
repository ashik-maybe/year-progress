<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" id="metaTheme" content="#e4e7ec">
    <script>
        (function () {
            try {
                var s = localStorage.getItem("year-theme");
                var dark = s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
                document.documentElement.dataset.theme = dark ? "dark" : "light";
                document.getElementById("metaTheme").content = dark ? "#0a0b0d" : "#e4e7ec";
            } catch (e) {
                document.documentElement.dataset.theme = "light";
                document.getElementById("metaTheme").content = "#e4e7ec";
            }
        })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Year Progress">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>Year Progress</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div class="bg bg-light"></div>
    <div class="bg bg-dark"></div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle color theme" aria-pressed="false" title="Toggle theme (T)">
        <svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4.4" />
            <path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.2 5.2l1.8 1.8M17 17l1.8 1.8M18.8 5.2L17 7M7 17l-1.8 1.8" />
        </svg>
        <svg class="ic ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M20.6 13.2A8.6 8.6 0 1 1 10.8 3.4a7 7 0 1 0 9.8 9.8z" />
        </svg>
    </button>
    <div class="container">
        <header>
            <h1>Year Progress</h1>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-number" id="daysPassed">0</span>
                    <span class="stat-label">Days Passed</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="daysRemaining">0</span>
                    <span class="stat-label">Days Remaining</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="percentage">0%</span>
                    <span class="stat-label">Percent complete</span>
                </div>
            </div>
        </header>

        <div class="progress-grid" id="progressGrid">
            <!-- Boxes will be generated by JavaScript -->
        </div>

        <p class="grid-caption">One box per week, from left to right.</p>

        <div class="current-date" id="currentDate"></div>
    </div>

    <div class="grain"></div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
