<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Year Progress">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>Year Progress</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Year Progress</h1>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-number" id="daysPassed">0</span>
                    <span class="stat-label">Days Passed</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="daysRemaining">0</span>
                    <span class="stat-label">Days Remaining</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="percentage">0%</span>
                    <span class="stat-label">Percent complete</span>
                </div>
            </div>
        </header>

        <div class="progress-grid" id="progressGrid">
            <!-- Boxes will be generated by JavaScript -->
        </div>

               <div class="current-date" id="currentDate"></div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
