<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Progress</title>
    <link rel="stylesheet" href="src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Source+Code+Pro:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Year Progress</h1>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-number" id="daysPassed">0</span>
                    <span class="stat-label">Days Passed</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="daysRemaining">0</span>
                    <span class="stat-label">Days Remaining</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="percentage">0%</span>
                    <span class="stat-label">% Complete</span>
                </div>
            </div>
        </header>

        <div class="progress-grid" id="progressGrid">
            <!-- Boxes will be generated by JavaScript -->
        </div>

        <div class="current-date" id="currentDate"></div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
